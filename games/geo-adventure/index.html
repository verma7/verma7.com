<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Geo Adventure 🌍</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: "Arial Rounded MT Bold", "Comic Sans MS", -apple-system, "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg,#7ecbff 0%,#b3e5ff 45%,#d9f4ff 100%);
    color:#1e3a5f;
    display:flex; flex-direction:column;
  }

  /* ---------- generic ---------- */
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active { display:flex; }
  button { font-family:inherit; border:none; cursor:pointer; }

  .big-btn {
    background:#ffb703; color:#5b3a00;
    border-radius:28px; padding:16px 34px; font-size:26px; font-weight:bold;
    box-shadow:0 6px 0 #d99400; transition:transform .1s;
  }
  .big-btn:active { transform:translateY(4px); box-shadow:0 2px 0 #d99400; }
  .big-btn.green { background:#7ed957; color:#0d4d00; box-shadow:0 6px 0 #55b32e; }
  .big-btn.green:active { box-shadow:0 2px 0 #55b32e; }

  /* ---------- home ---------- */
  #home { align-items:center; justify-content:flex-start; padding:20px; overflow-y:auto; }
  #home h1 {
    font-size:clamp(34px,6vw,56px); margin:10px 0 2px; color:#0b4f8a;
    text-shadow:0 3px 0 rgba(255,255,255,.7);
  }
  #home .subtitle { font-size:clamp(16px,2.5vw,22px); color:#2a6da8; margin-bottom:18px; }
  #cards {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px; width:100%; max-width:1050px;
  }
  .card {
    background:#fff; border-radius:26px; padding:20px 14px 16px; text-align:center;
    box-shadow:0 8px 0 rgba(30,80,140,.15); position:relative;
    transition:transform .12s;
  }
  .card:not(.locked):active { transform:scale(.96); }
  .card .emoji { font-size:60px; line-height:1.1; }
  .card .name { font-size:22px; font-weight:bold; margin:8px 0 4px; color:#0b4f8a; }
  .card .stars { font-size:24px; letter-spacing:3px; }
  .card.locked { filter:grayscale(.9); opacity:.65; }
  .card.locked::after {
    content:"🔒"; position:absolute; top:10px; right:14px; font-size:28px;
  }
  #resetBtn {
    margin-top:22px; background:transparent; color:#5a86ad; font-size:14px;
    text-decoration:underline;
  }
  #muteBtn {
    position:absolute; top:14px; right:14px; font-size:26px; background:#fff;
    border-radius:50%; width:52px; height:52px; box-shadow:0 4px 0 rgba(30,80,140,.15);
  }

  /* ---------- level screen ---------- */
  #level { background:linear-gradient(160deg,#7ecbff,#d9f4ff); }
  #topbar {
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  #backBtn {
    background:#fff; border-radius:20px; font-size:22px; padding:10px 18px;
    font-weight:bold; color:#0b4f8a; box-shadow:0 4px 0 rgba(30,80,140,.15);
  }
  #levelTitle { font-size:clamp(20px,3.4vw,30px); font-weight:bold; color:#0b4f8a; flex:1; text-align:center; }
  #modeToggle { display:flex; gap:8px; }
  .mode-btn {
    border-radius:20px; padding:10px 16px; font-size:18px; font-weight:bold;
    background:#e3f2ff; color:#3a729f; box-shadow:0 4px 0 rgba(30,80,140,.12);
  }
  .mode-btn.on { background:#ffb703; color:#5b3a00; box-shadow:0 4px 0 #d99400; }

  #promptBar {
    margin:4px 14px; background:#fff; border-radius:22px; padding:10px 16px;
    display:flex; align-items:center; gap:12px; min-height:58px;
    box-shadow:0 5px 0 rgba(30,80,140,.12);
  }
  #promptText { flex:1; font-size:clamp(18px,3vw,26px); font-weight:bold; color:#0b4f8a; }
  #repeatBtn { font-size:28px; background:#e3f2ff; border-radius:50%; width:50px; height:50px; flex:0 0 auto; }
  #progressDots { display:flex; gap:6px; flex:0 0 auto; align-items:center; }
  .dot { width:14px; height:14px; border-radius:50%; background:#cfe6f7; }
  .dot.done { background:#7ed957; }
  .dot.now { background:#ffb703; transform:scale(1.25); }

  #stage { flex:1; margin:6px 14px 14px; position:relative; min-height:0; }
  #stage svg { width:100%; height:100%; display:block; }

  /* SVG interactives */
  .tap { cursor:pointer; transition:filter .15s; }
  .tap .shape { transition:transform .15s; transform-box:fill-box; transform-origin:center; }
  .tap:active .shape { transform:scale(1.06); }
  .tap.correct .shape { animation:pop .5s ease; }
  .tap.wrongshake { animation:shake .4s ease; }
  .tap.glowhint .shape { animation:glowpulse 1s ease infinite; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @keyframes glowpulse {
    0%,100% { filter:drop-shadow(0 0 4px #ffd900) drop-shadow(0 0 10px #ffd900); }
    50%     { filter:drop-shadow(0 0 14px #ffee55) drop-shadow(0 0 26px #ffee55); }
  }
  .tap text { pointer-events:none; }

  /* ---------- result overlay ---------- */
  #overlay {
    position:absolute; inset:0; background:rgba(10,40,80,.45);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  #overlay.show { display:flex; }
  #resultCard {
    background:#fff; border-radius:34px; padding:34px 44px; text-align:center;
    max-width:520px; width:88%;
    animation:cardin .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes cardin { from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1} }
  #resultCard h2 { font-size:34px; color:#0b4f8a; margin-bottom:8px; }
  #resultStars { font-size:56px; letter-spacing:8px; margin:8px 0 14px; }
  #resultMsg { font-size:20px; color:#3a729f; margin-bottom:20px; }
  #resultCard .row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

  /* confetti */
  .confetti {
    position:fixed; top:-20px; width:14px; height:14px; z-index:100;
    pointer-events:none; border-radius:3px;
    animation:fall linear forwards;
  }
  @keyframes fall {
    to { transform:translateY(110vh) rotate(720deg); opacity:.9; }
  }

  /* toast for explore-mode name */
  #toast {
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:#fff; border-radius:22px; padding:12px 24px; font-size:22px;
    font-weight:bold; color:#0b4f8a; box-shadow:0 6px 0 rgba(30,80,140,.15);
    display:none; max-width:92%; text-align:center; z-index:20;
  }
  #toast.show { display:block; animation:toastin .3s ease; }
  @keyframes toastin { from{transform:translate(-50%,20px); opacity:0} to{transform:translate(-50%,0); opacity:1} }
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div id="home" class="screen active">
  <button id="muteBtn" title="Sound on/off">🔊</button>
  <h1>🌍 Geo Adventure</h1>
  <div class="subtitle">Tap to explore, listen and learn!</div>
  <div id="cards"></div>
  <button id="resetBtn">reset progress (for grown-ups)</button>
</div>

<!-- ============ LEVEL ============ -->
<div id="level" class="screen">
  <div id="topbar">
    <button id="backBtn">⬅ Home</button>
    <div id="levelTitle"></div>
    <div id="modeToggle">
      <button class="mode-btn" id="exploreBtn">👆 Explore</button>
      <button class="mode-btn" id="quizBtn">⭐ Quiz</button>
    </div>
  </div>
  <div id="promptBar">
    <button id="repeatBtn">🔊</button>
    <div id="promptText"></div>
    <div id="progressDots"></div>
  </div>
  <div id="stage"></div>
  <div id="toast"></div>

  <div id="overlay">
    <div id="resultCard">
      <h2 id="resultTitle">Great job!</h2>
      <div id="resultStars"></div>
      <div id="resultMsg"></div>
      <div class="row">
        <button class="big-btn" id="againBtn">🔁 Play again</button>
        <button class="big-btn green" id="homeBtn">🏠 Home</button>
      </div>
    </div>
  </div>
</div>

function svgNACountries() {
  const OVR = { canada:[500,470], usa:[565,645] };
  let g = "";
  for (const c of NA_COUNTRIES) {
    const s = { ...MAPDATA.na[c.id] };

    g += `<g class="tap" data-id="${c.id}">
            <path class="shape" d="${s.d}" fill="${NA_FILLS[c.id]}" stroke="#ffffff" stroke-width="1.2"/>${label}
          </g>`;
  }
  const [x0,y0,x1,y1] = MAPDATA.naBox;
  const vb = `${x0-10} ${y0-8} ${x1-x0+20} ${y1-y0+20}`;
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">
    <rect x="${x0-10}" y="${y0-8}" width="${x1-x0+20}" height="${y1-y0+20}" rx="12" fill="#bfe6ff"/>

  </svg>`;
}

function svgStates() {
  const palette = ["#ff6b6b","#ffb703","#7ed957","#3d9be9","#9b5de5","#f45d9d","#5fd0c5","#e2703a"];
  const OVR = { FL:[749,521], LA:[556,446], HI:[258,577], MI:[640,152], KY:[652,296] };
  let g = "";
  MAPDATA.states.forEach((s, i) => {
    const fill = palette[(i*3) % palette.length];
    const lb = OVR[s.a] || s.label;
    const label = (lb && !TINY_STATES.has(s.a))
      ? `<text x="${lb[0]}" y="${lb[1]}" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" stroke="rgba(0,0,0,0.35)" stroke-width="2" paint-order="stroke">${s.a}</text>`
      : "";
    g += `<g class="tap" data-id="${s.a}">
            <path class="shape" d="${s.d}" fill="${fill}" stroke="#ffffff" stroke-width="1"/>${label}
          </g>`;
  });
  return `<svg viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="960" height="600" rx="14" fill="#e8f6ff"/>
    ${g}
  </svg>`;
}

function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    if (p && p.stars) return p;
  } catch (e) {}
  return { stars: {} };
}
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {} }
let progress = loadProgress();

function starsFor(levelId) { return progress.stars[levelId] || 0; }
function isUnlocked(index) { return index === 0 || starsFor(LEVELS[index - 1].id) >= 1; }

/* ---------- speech ---------- */
let muted = false;
let chosenVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith("en"));
  if (!voices.length) return;
  // Prefer Apple's downloadable neural voices (Settings > Accessibility >
  // Spoken Content > Voices), and never pick a network-only voice — the
  // game must keep talking with no internet.
  const favorites = ["Ava","Zoe","Samantha","Allison","Susan","Nicky","Karen","Moira","Serena","Nathan","Evan","Tom","Daniel","Alex"];
  const score = v => {
    let s = 0;
    if (/premium/i.test(v.name)) s += 400;
    if (/enhanced/i.test(v.name)) s += 300;
    if (v.localService) s += 200; else s -= 500;
    if (/compact/i.test(v.name)) s -= 100;
    const i = favorites.findIndex(n => v.name.startsWith(n));
    if (i >= 0) s += favorites.length - i;
    if (v.lang.startsWith("en-US")) s += 5;
    return s;
  };
  chosenVoice = voices.sort((a, b) => score(b) - score(a))[0];
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (muted || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.92;
  u.pitch = 1.1;
  if (chosenVoice) u.voice = chosenVoice;
  speechSynthesis.speak(u);
}

/* ---------- sounds (WebAudio, no assets) ---------- */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, start, dur, type, vol) {
  const ctx = audio(); if (!ctx || muted) return;
  const o = ctx.createOscillator(), gn = ctx.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  gn.gain.setValueAtTime(0.0001, ctx.currentTime + start);
  gn.gain.exponentialRampToValueAtTime(vol || 0.18, ctx.currentTime + start + 0.02);
  gn.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
  o.connect(gn); gn.connect(ctx.destination);
  o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur + 0.05);
}
function sndCorrect() { tone(523,0,.15,"triangle"); tone(659,.12,.15,"triangle"); tone(784,.24,.3,"triangle"); }
function sndWrong()   { tone(220,0,.25,"sine",.12); }
function sndTap()     { tone(440,0,.08,"triangle",.1); }
function sndFanfare() {
  [523,659,784,1047].forEach((f,i)=>tone(f,i*.15,.4,"triangle",.16));
  tone(1319,.65,.6,"triangle",.14);
}

/* ---------- confetti ---------- */
function confetti(n) {
  const colors = ["#ff6b6b","#ffb703","#7ed957","#3d9be9","#9b5de5","#f45d9d"];
  for (let i = 0; i < (n || 40); i++) {
    const el = document.createElement("div");
    el.className = "confetti";
    el.style.left = Math.random()*100 + "vw";
    el.style.background = pick(colors);
    el.style.animationDuration = (1.6 + Math.random()*1.6) + "s";
    el.style.animationDelay = (Math.random()*0.4) + "s";
    el.style.transform = "rotate(" + Math.random()*360 + "deg)";
    if (Math.random() < .4) el.style.borderRadius = "50%";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

/* =====================================================================
   GAME STATE + UI
===================================================================== */

const $ = id => document.getElementById(id);
let currentLevel = null;   // level object
let mode = "explore";      // explore | quiz
let quiz = null;           // { pool, index, wrongThisQ, firstTryCorrect, awaiting }
let advanceTimer = null;

function show(screenId) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(screenId).classList.add("active");
}

/* ---------- home ---------- */
function renderHome() {
  const cards = $("cards");
  cards.innerHTML = "";
  LEVELS.forEach((lv, i) => {
    const unlocked = isUnlocked(i);
    const st = starsFor(lv.id);
    const div = document.createElement("div");
    div.className = "card" + (unlocked ? "" : " locked");
    div.innerHTML = `
      <div class="emoji">${lv.emoji}</div>
      <div class="name">${lv.title}</div>
      <div class="stars">${"⭐".repeat(st)}${"☆".repeat(3 - st)}</div>`;
    div.addEventListener("click", () => {
      sndTap();
      if (!unlocked) {
        speak(`This level is locked! Win a star in ${LEVELS[i-1].title} to open it!`);
        return;
      }
      openLevel(lv);
    });
    cards.appendChild(div);
  });
}

/* ---------- level ---------- */
function openLevel(lv) {
  currentLevel = lv;
  $("levelTitle").textContent = lv.emoji + " " + lv.title;
  $("stage").innerHTML = lv.render();
  $("stage").querySelectorAll(".tap").forEach(el => {
    el.addEventListener("click", () => onTap(el));
  });
  show("level");
  $("overlay").classList.remove("show");
  setMode("explore", true);
}

function setMode(m, isEntering) {
  mode = m;
  clearTimeout(advanceTimer);
  clearHighlights();
  $("exploreBtn").classList.toggle("on", m === "explore");
  $("quizBtn").classList.toggle("on", m === "quiz");
  $("toast").classList.remove("show");
  if (m === "explore") {
    quiz = null;
    $("progressDots").innerHTML = "";
    $("promptText").textContent = "Tap anything to hear about it!";
    speak(isEntering ? currentLevel.intro : "Explore time! Tap anything to hear about it!");
  } else {
    startQuiz();
  }
}

function clearHighlights() {
  $("stage").querySelectorAll(".tap").forEach(el =>
    el.classList.remove("correct","wrongshake","glowhint"));
}

function itemById(id) { return currentLevel.items.find(it => it.id === id); }

/* ---------- explore ---------- */
function explore(el) {
  const item = itemById(el.dataset.id);
  if (!item) return;
  clearHighlights();
  el.classList.add("correct");
  sndTap();
  const toast = $("toast");
  toast.textContent = "📣 " + item.name;
  toast.classList.add("show");
  speak(item.say || `This is ${item.name}! ${item.fact}`);
  setTimeout(() => el.classList.remove("correct"), 600);
}

/* ---------- quiz ---------- */
function startQuiz() {
  quiz = {
    pool: currentLevel.quizPool(),
    index: 0,
    wrongThisQ: 0,
    firstTryCorrect: 0,
    awaiting: true,
  };
  renderDots();
  askQuestion(true);
}

function renderDots() {
  const dots = $("progressDots");
  dots.innerHTML = "";
  quiz.pool.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i < quiz.index ? " done" : i === quiz.index ? " now" : "");
    dots.appendChild(d);
  });
}

function currentTarget() { return itemById(quiz.pool[quiz.index]); }

function questionText() {
  const t = currentTarget();
  return `Can you find ${t.name}?`;
}

function askQuestion(first) {
  clearHighlights();
  quiz.wrongThisQ = 0;
  quiz.awaiting = true;
  renderDots();
  const t = currentTarget();
  $("promptText").textContent = `🔍 Find ${t.name}!`;
  speak((first ? "Quiz time! " : "") + questionText());
}

function onTap(el) {
  if (mode === "explore") { explore(el); return; }
  if (!quiz || !quiz.awaiting) return;
  const t = currentTarget();
  if (el.dataset.id === t.id) {
    quiz.awaiting = false;
    if (quiz.wrongThisQ === 0) quiz.firstTryCorrect++;
    clearHighlights();
    el.classList.add("correct");
    sndCorrect();
    confetti(18);
    const praise = pick(PRAISE);
    $("promptText").textContent = "🎉 " + praise;
    speak(`${praise} That is ${t.name}! ${quiz.wrongThisQ === 0 ? shortFact(t) : ""}`);
    advanceTimer = setTimeout(nextQuestion, 2600);
  } else {
    quiz.wrongThisQ++;
    el.classList.add("wrongshake");
    setTimeout(() => el.classList.remove("wrongshake"), 450);
    sndWrong();
    const tapped = itemById(el.dataset.id);
    if (quiz.wrongThisQ >= 2) {
      // show the answer glowing
      const target = $("stage").querySelector(`.tap[data-id="${t.id}"]`);
      if (target) target.classList.add("glowhint");
      speak(`That is ${tapped ? tapped.name : "not it"}. Look! ${t.name} is glowing! Tap the glowing ${currentLevel.findWord}!`);
    } else {
      speak(`${pick(TRY_AGAIN)} That was ${tapped ? tapped.name : "something else"}. ${questionText()}`);
    }
  }
}

function shortFact(item) {
  // first sentence of the fact, keeps praise snappy
  const m = item.fact.match(/^[^.!?]+[.!?]/);
  return m ? m[0] : "";
}

function nextQuestion() {
  quiz.index++;
  if (quiz.index >= quiz.pool.length) { finishQuiz(); return; }
  askQuestion(false);
}

function finishQuiz() {
  const total = quiz.pool.length;
  const good = quiz.firstTryCorrect;
  const stars = good === total ? 3 : good >= Math.ceil(total * 0.6) ? 2 : 1;
  const prev = starsFor(currentLevel.id);
  if (stars > prev) {
    progress.stars[currentLevel.id] = stars;
    saveProgress();
  }
  const idx = LEVELS.indexOf(currentLevel);
  const unlockedNext = idx < LEVELS.length - 1 && prev === 0;

  $("resultTitle").textContent = stars === 3 ? "PERFECT! 🏆" : stars === 2 ? "Great job! 🎉" : "You did it! 💪";
  $("resultStars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  $("resultMsg").textContent =
    `You found ${good} out of ${total} on the first try!` +
    (unlockedNext ? ` You unlocked ${LEVELS[idx+1].title}! ${LEVELS[idx+1].emoji}` : "");
  $("overlay").classList.add("show");
  sndFanfare();
  confetti(80);
  speak(
    (stars === 3 ? "Wow! Perfect score! Three stars! " :
     stars === 2 ? "Great job! You earned two stars! " :
     "You did it! You earned a star! ") +
    (unlockedNext ? `And you unlocked the next level: ${LEVELS[idx+1].title}!` : "Play again to earn more stars!")
  );
}

/* =====================================================================
   WIRING
===================================================================== */

$("backBtn").addEventListener("click", () => {
  sndTap(); clearTimeout(advanceTimer);
  speechSynthesis && speechSynthesis.cancel();
  renderHome(); show("home");
});
$("exploreBtn").addEventListener("click", () => { sndTap(); setMode("explore"); });
$("quizBtn").addEventListener("click", () => { sndTap(); setMode("quiz"); });
$("repeatBtn").addEventListener("click", () => {
  sndTap();
  if (mode === "quiz" && quiz && quiz.awaiting) speak(questionText());
  else speak($("promptText").textContent.replace(/^[^\w]+/, ""));
});
$("againBtn").addEventListener("click", () => {
  sndTap(); $("overlay").classList.remove("show"); startQuiz();
});
$("homeBtn").addEventListener("click", () => {
  sndTap(); $("overlay").classList.remove("show");
  renderHome(); show("home");
});
$("muteBtn").addEventListener("click", () => {
  muted = !muted;
  $("muteBtn").textContent = muted ? "🔇" : "🔊";
  if (muted && "speechSynthesis" in window) speechSynthesis.cancel();
  else speak("Sound is on!");
});
$("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all stars and progress?")) {
    progress = { stars: {} };
    saveProgress();
    renderHome();
  }
});

/* greet on first interaction (iOS needs a tap before speech) */
let greeted = false;
document.body.addEventListener("pointerdown", () => {
  audio();
  if (!greeted && $("home").classList.contains("active")) {
    greeted = true;
    speak("Hi explorer! Welcome to Geo Adventure! Pick a level and let's learn together!");
  }
}, { once:false });

renderHome();
</script>
</body>
</html>
