<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Match!</title>
<style>
  :root{
    --bg1:#4facfe; --bg2:#a86ff0; --bg3:#ff7eb3;
    --ink:#2b1a4a;
    --card-back1:#ffd166; --card-back2:#ff8fab;
    --cs: 90px;   /* card size, set by JS */
    --gap: 10px;  /* grid gap, set by JS */
    --fs: 50px;   /* emoji size, set by JS */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"SF Pro Rounded",ui-rounded,"Baloo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff;
    background:linear-gradient(140deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
    overflow:hidden;
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------------- MENU ---------------- */
  #menu{overflow-y:auto;align-items:center;padding:18px 16px 28px;}
  .title{
    font-size:clamp(34px,8vw,64px);font-weight:900;letter-spacing:-1px;
    text-shadow:0 4px 0 rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.22);
    margin:6px 0 2px;text-align:center;line-height:1.05;
  }
  .subtitle{opacity:.9;font-size:clamp(14px,3.6vw,19px);font-weight:700;margin-bottom:16px;text-align:center;}
  .panel{
    width:min(680px,100%);background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.35);
    border-radius:26px;padding:16px;margin-bottom:14px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .panel h2{margin:0 0 12px;font-size:clamp(16px,4vw,21px);font-weight:800;letter-spacing:.3px;}
  .grid-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:9px;}
  .opt{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:rgba(255,255,255,.9);color:var(--ink);
    border:4px solid transparent;border-radius:20px;
    padding:10px 6px;font-size:15px;font-weight:800;cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.16);transition:transform .08s,box-shadow .08s,border-color .12s;
  }
  .opt .big{font-size:28px;line-height:1.1;}
  .opt .sm{font-size:12px;font-weight:700;opacity:.65;}
  .opt:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.16);}
  .opt.sel{border-color:#fff;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.16),0 0 0 5px rgba(255,255,255,.45);}

  .more{margin-top:12px;}
  .more-btn{
    background:none;border:none;color:#fff;font:inherit;font-weight:800;font-size:15px;
    opacity:.92;cursor:pointer;padding:6px 2px;
  }
  .slider-wrap{display:none;margin-top:8px;}
  .slider-wrap.open{display:block;}
  .slider-val{font-weight:900;font-size:18px;margin-bottom:6px;}
  input[type=range]{width:100%;height:38px;accent-color:#fff;cursor:pointer;}

  .best{min-height:24px;font-weight:800;font-size:15px;opacity:.95;text-align:center;margin:2px 0 12px;}

  .play{
    width:min(680px,100%);
    background:linear-gradient(180deg,#8bf59a,#2fc85f);color:#0d3d1e;
    border:none;border-radius:26px;padding:20px;font:inherit;font-size:clamp(22px,5.5vw,30px);font-weight:900;
    cursor:pointer;box-shadow:0 7px 0 #1a8b3f, 0 12px 26px rgba(0,0,0,.24);
    transition:transform .08s,box-shadow .08s;
  }
  .play:active{transform:translateY(6px);box-shadow:0 1px 0 #1a8b3f;}

  /* ---------------- GAME ---------------- */
  #game{padding:8px 10px 12px;}
  .bar{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;flex:0 0 auto;}
  .chip{
    background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.35);
    border-radius:16px;padding:8px 12px;font-weight:800;font-size:clamp(13px,3.4vw,17px);
    white-space:nowrap;
  }
  .icon-btn{
    background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.35);color:#fff;
    border-radius:16px;padding:8px 12px;font:inherit;font-size:clamp(15px,4vw,19px);font-weight:800;
    cursor:pointer;
  }
  .icon-btn:active{transform:translateY(2px);}
  .spacer{flex:1;}

  .board-area{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;}
  #board{
    display:grid;gap:var(--gap);
    grid-auto-rows:var(--cs);
    justify-content:center;align-content:center;
  }
  .card{
    width:var(--cs);height:var(--cs);
    perspective:800px;cursor:pointer;background:none;border:none;padding:0;
    animation:deal .32s cubic-bezier(.2,1.3,.5,1) backwards;
  }
  @keyframes deal{from{opacity:0;transform:scale(.5) translateY(18px);}to{opacity:1;transform:none;}}
  .inner{
    position:relative;width:100%;height:100%;
    transition:transform .35s cubic-bezier(.4,1.4,.5,1);
    transform-style:preserve-3d;
  }
  .card.flipped .inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    border-radius:18%;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 4px 0 rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.18);
  }
  .back{
    background:linear-gradient(150deg,var(--card-back1),var(--card-back2));
    font-size:calc(var(--fs) * .62);
  }
  .back span{opacity:.55;}
  .front{
    background:#fff;transform:rotateY(180deg);
    font-size:var(--fs);line-height:1;
  }
  .card.matched{cursor:default;animation:pop .4s ease;}
  .card.matched .front{background:#eaffef;box-shadow:0 0 0 4px #6ee787, 0 4px 0 rgba(0,0,0,.12);}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.16) rotate(3deg);}100%{transform:scale(1);}}
  .card.wrong .inner{animation:shake .38s ease;}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-7px);}75%{transform:rotateY(180deg) translateX(7px);}}

  /* ---------------- WIN ---------------- */
  #win{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(30,10,60,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    z-index:20;padding:20px;
  }
  #win.show{display:flex;}
  .win-card{
    background:#fff;color:var(--ink);border-radius:32px;padding:26px 22px;
    width:min(420px,100%);text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
    animation:rise .4s cubic-bezier(.2,1.3,.5,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.9);}to{opacity:1;transform:none;}}
  .win-card h2{margin:0 0 4px;font-size:clamp(28px,7vw,38px);font-weight:900;}
  .win-emoji{font-size:56px;line-height:1;margin-bottom:6px;}
  .win-stats{font-size:19px;font-weight:800;margin:12px 0;}
  .badge{
    display:inline-block;background:linear-gradient(180deg,#ffe066,#ffb703);color:#5c3a00;
    padding:8px 16px;border-radius:999px;font-weight:900;font-size:17px;margin-bottom:8px;
  }
  .win-btns{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .wbtn{
    border:none;border-radius:20px;padding:16px;font:inherit;font-size:20px;font-weight:900;cursor:pointer;
    transition:transform .08s,box-shadow .08s;
  }
  .wbtn:active{transform:translateY(4px);}
  .wbtn.green{background:linear-gradient(180deg,#8bf59a,#2fc85f);color:#0d3d1e;box-shadow:0 5px 0 #1a8b3f;}
  .wbtn.green:active{box-shadow:0 1px 0 #1a8b3f;}
  .wbtn.grey{background:#eee6f7;color:var(--ink);box-shadow:0 5px 0 #cbbfe0;}
  .wbtn.grey:active{box-shadow:0 1px 0 #cbbfe0;}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:30;}
</style>
</head>
<body>

<div id="app">
  <!-- ================= MENU ================= -->
  <section id="menu" class="screen active">
    <div class="title">Memory Match!</div>
    <div class="subtitle">Flip two cards. Find the twins! 🎉</div>

    <div class="panel">
      <h2>1. Pick your pictures</h2>
      <div class="grid-opts" id="themes"></div>
    </div>

    <div class="panel">
      <h2>2. How many cards?</h2>
      <div class="grid-opts" id="levels"></div>
      <div class="more">
        <button class="more-btn" id="moreBtn">⚙️ More sizes ▾</button>
        <div class="slider-wrap" id="sliderWrap">
          <div class="slider-val" id="sliderVal">12 cards · 6 pairs</div>
          <input type="range" id="sizeRange" min="2" max="36" step="2" value="12">
        </div>
      </div>
    </div>

    <div class="best" id="menuBest"></div>
    <button class="play" id="playBtn">▶︎ Let's Play!</button>
  </section>

  <!-- ================= GAME ================= -->
  <section id="game" class="screen">
    <div class="bar">
      <button class="icon-btn" id="backBtn" aria-label="Back to menu">⬅︎</button>
      <div class="chip" id="movesChip">Moves 0</div>
      <div class="chip" id="timeChip">0:00</div>
      <div class="spacer"></div>
      <button class="icon-btn" id="voiceBtn" aria-label="Talking on or off">🗣️</button>
      <button class="icon-btn" id="soundBtn" aria-label="Sound on or off">🔊</button>
      <button class="icon-btn" id="againBtn" aria-label="Shuffle and restart">🔄</button>
    </div>
    <div class="board-area"><div id="board"></div></div>
  </section>
</div>

<!-- ================= WIN ================= -->
<div id="win">
  <div class="win-card">
    <div class="win-emoji" id="winEmoji">🎉</div>
    <h2 id="winTitle">You did it!</h2>
    <div id="winBadge"></div>
    <div class="win-stats" id="winStats"></div>
    <div class="win-btns">
      <button class="wbtn green" id="againBtn2">Play Again</button>
      <button class="wbtn grey" id="menuBtn2">Change Level</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
(function(){
"use strict";

/* ---------------- data ---------------- */
/* each entry is [emoji, spoken name] */
const PACKS = {
  animals : {label:"Animals", icon:"🐻", set:[
    ["🐶","Dog"],["🐱","Cat"],["🐭","Mouse"],["🐹","Hamster"],["🐰","Rabbit"],["🦊","Fox"],
    ["🐻","Bear"],["🐼","Panda"],["🐨","Koala"],["🐯","Tiger"],["🦁","Lion"],["🐮","Cow"],
    ["🐷","Pig"],["🐸","Frog"],["🐵","Monkey"],["🐔","Chicken"],["🐧","Penguin"],["🦉","Owl"]]},
  food    : {label:"Yummy",   icon:"🍕", set:[
    ["🍎","Apple"],["🍌","Banana"],["🍇","Grapes"],["🍓","Strawberry"],["🍒","Cherries"],["🍉","Watermelon"],
    ["🍕","Pizza"],["🍔","Burger"],["🌭","Hot dog"],["🍟","French fries"],["🍩","Doughnut"],["🍪","Cookie"],
    ["🎂","Birthday cake"],["🍦","Ice cream"],["🍿","Popcorn"],["🥕","Carrot"],["🌽","Corn"],["🥨","Pretzel"]]},
  vehicles: {label:"Go Go Go",icon:"🚗", set:[
    ["🚗","Car"],["🚕","Taxi"],["🚌","Bus"],["🚒","Fire truck"],["🚑","Ambulance"],["🚓","Police car"],
    ["🚚","Truck"],["🚜","Tractor"],["🏎️","Race car"],["🚂","Train"],["🚀","Rocket"],["🛸","Flying saucer"],
    ["✈️","Airplane"],["🚁","Helicopter"],["⛵","Sailboat"],["🚤","Speedboat"],["🚲","Bicycle"],["🛵","Scooter"]]},
  space   : {label:"Space",   icon:"🚀", set:[
    ["🌞","Sun"],["🌝","Full moon"],["🌟","Sparkly star"],["🌈","Rainbow"],["☁️","Cloud"],["⚡","Lightning"],
    ["❄️","Snowflake"],["🔥","Fire"],["🌍","Earth"],["🪐","Planet"],["🚀","Rocket"],["🛸","Flying saucer"],
    ["👽","Alien"],["🌠","Shooting star"],["☄️","Comet"],["🌙","Moon"],["⭐","Star"],["🌋","Volcano"]]},
  mix     : {label:"Surprise",icon:"🎁", set:null}
};
const LEVELS = [
  {label:"Tiny",  icon:"🐣", n:2},
  {label:"Easy",  icon:"🙂", n:8},
  {label:"Medium",icon:"😃", n:16},
  {label:"Hard",  icon:"😲", n:24},
  {label:"Whoa!", icon:"🤯", n:36}
];
const BACK_ICONS = ["✨","⭐","💫","🌟"];

/* ---------------- state ---------------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem("memmatch."+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("memmatch."+k, JSON.stringify(v)); }catch(e){} }
};
let theme = store.get("theme","animals");
let count = store.get("count",16);
let soundOn = store.get("sound",true);
let voiceOn = store.get("voice",true);

let deck=[], flipped=[], lock=false, moves=0, matchedCount=0;
let startMs=0, timerId=null, elapsed=0;

const $ = id => document.getElementById(id);

/* ---------------- sound (WebAudio, no files) ---------------- */
let actx=null;
function audio(){
  if(!actx){ const AC = window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }
  if(actx && actx.state==="suspended") actx.resume();
  return actx;
}
function tone(freq, start, dur, type, vol){
  const ac=audio(); if(!ac||!soundOn) return;
  const t0=ac.currentTime+start;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||0.18, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const SFX = {
  flip : ()=> tone(660,0,0.09,"triangle",0.14),
  match: ()=>{ tone(784,0,0.13,"sine",0.18); tone(1046,0.11,0.22,"sine",0.16); },
  miss : ()=>{ tone(220,0,0.16,"sawtooth",0.09); tone(165,0.1,0.2,"sine",0.10); },
  win  : ()=>{ [523,659,784,1046,1318].forEach((f,i)=> tone(f, i*0.11, 0.32, "triangle", 0.17)); }
};

/* ---------------- talking (Web Speech, offline voices) ---------------- */
const SPEECH = window.speechSynthesis || null;
let chosenVoice=null;
function pickVoice(){
  if(!SPEECH) return;
  const vs=SPEECH.getVoices()||[];
  const en=vs.filter(v=>/^en\b|^en[-_]/i.test(v.lang));
  chosenVoice = en.find(v=>v.localService) || en[0] || null;
}
if(SPEECH){ pickVoice(); SPEECH.addEventListener("voiceschanged", pickVoice); }
/* interrupt=true for card names so fast tapping never builds a backlog */
function say(text, interrupt){
  if(!SPEECH || !voiceOn || !text) return;
  try{
    if(interrupt) SPEECH.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(chosenVoice) u.voice=chosenVoice;
    u.rate=0.85; u.pitch=1.2; u.volume=1;
    SPEECH.speak(u);
  }catch(e){}
}

/* ---------------- menu build ---------------- */
function buildMenu(){
  const tw = $("themes"); tw.innerHTML="";
  Object.keys(PACKS).forEach(key=>{
    const p=PACKS[key];
    const b=document.createElement("button");
    b.className="opt"+(key===theme?" sel":"");
    b.dataset.k=key;
    b.innerHTML='<span class="big">'+p.icon+'</span>'+p.label;
    b.onclick=()=>{ theme=key; store.set("theme",key); SFX.flip();
      [...tw.children].forEach(c=>c.classList.toggle("sel", c.dataset.k===key)); };
    tw.appendChild(b);
  });

  const lw = $("levels"); lw.innerHTML="";
  LEVELS.forEach(l=>{
    const b=document.createElement("button");
    b.className="opt"; b.dataset.n=l.n;
    b.innerHTML='<span class="big">'+l.icon+'</span>'+l.label+'<span class="sm">'+l.n+' cards</span>';
    b.onclick=()=>{ setCount(l.n); SFX.flip(); };
    lw.appendChild(b);
  });

  $("sizeRange").value = count;
  $("sizeRange").oninput = e => setCount(parseInt(e.target.value,10));
  $("moreBtn").onclick = ()=>{
    const w=$("sliderWrap"), open=w.classList.toggle("open");
    $("moreBtn").textContent = open ? "⚙️ More sizes ▴" : "⚙️ More sizes ▾";
  };
  syncCount();
}
function setCount(n){ count=n; store.set("count",n); $("sizeRange").value=n; syncCount(); }
function syncCount(){
  [...$("levels").children].forEach(c=> c.classList.toggle("sel", parseInt(c.dataset.n,10)===count));
  $("sliderVal").textContent = count+" cards · "+(count/2)+" "+(count/2===1?"pair":"pairs");
  const b=bestFor(count);
  $("menuBest").textContent = b
    ? "🏆 Best for "+count+" cards: "+b.moves+(b.moves===1?" move in ":" moves in ")+fmt(b.ms)
    : "🎯 "+count+" cards — no best score yet!";
}
const bestKey = n => "best."+n;
const bestFor = n => store.get(bestKey(n), null);

/* ---------------- game ---------------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function makeDeck(){
  const pairs = count/2;
  let pool;
  if(theme==="mix"){
    const byEmoji=new Map();
    Object.keys(PACKS).forEach(k=>{ if(PACKS[k].set) PACKS[k].set.forEach(p=>byEmoji.set(p[0],p)); });
    pool=[...byEmoji.values()];
  } else pool=[...PACKS[theme].set];
  const picks = shuffle(pool).slice(0,pairs);
  const cards=[];
  picks.forEach((p,i)=>{ cards.push({e:p[0],name:p[1],pid:i},{e:p[0],name:p[1],pid:i}); });
  return shuffle(cards);
}

function startGame(){
  deck=makeDeck(); flipped=[]; lock=false; moves=0; matchedCount=0; elapsed=0;
  startMs=0; stopTimer(); if(SPEECH) SPEECH.cancel();
  $("movesChip").textContent="Moves 0";
  $("timeChip").textContent="0:00";
  const back = BACK_ICONS[Math.floor(Math.random()*BACK_ICONS.length)];

  const board=$("board"); board.innerHTML="";
  deck.forEach((c,i)=>{
    const btn=document.createElement("button");
    btn.className="card"; btn.dataset.i=i;
    btn.style.animationDelay=(i*0.03)+"s";
    btn.innerHTML='<div class="inner"><div class="face back"><span>'+back+'</span></div>'+
                  '<div class="face front">'+c.e+'</div></div>';
    btn.addEventListener("click",()=>onFlip(i,btn));
    board.appendChild(btn);
  });
  layout();
  show("game");
}

function onFlip(i, el){
  if(lock || el.classList.contains("flipped") || el.classList.contains("matched")) return;
  audio();
  if(!startMs) startTimer();
  el.classList.add("flipped");
  SFX.flip();
  say(deck[i].name, true);
  flipped.push({i, el});
  if(flipped.length<2) return;

  moves++; $("movesChip").textContent="Moves "+moves;
  const [a,b]=flipped; lock=true;

  if(deck[a.i].pid===deck[b.i].pid){
    SFX.match();
    say("Match!");                 // queued, so it follows the card's name
    setTimeout(()=>{
      a.el.classList.add("matched"); b.el.classList.add("matched");
      matchedCount+=2; flipped=[]; lock=false;
      if(matchedCount===deck.length) finish();
    },320);
  } else {
    setTimeout(()=>SFX.miss(),330);
    a.el.classList.add("wrong"); b.el.classList.add("wrong");
    setTimeout(()=>{
      [a,b].forEach(c=>c.el.classList.remove("flipped","wrong"));
      flipped=[]; lock=false;
    },900);
  }
}

/* ---------------- timer ---------------- */
function startTimer(){
  startMs=Date.now();
  timerId=setInterval(()=>{
    elapsed=Date.now()-startMs;
    $("timeChip").textContent=fmt(elapsed);
  },250);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function fmt(ms){
  const s=Math.floor(ms/1000);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

/* ---------------- win ---------------- */
function finish(){
  stopTimer();
  if(startMs) elapsed=Date.now()-startMs;
  SFX.win();

  const prev=bestFor(count);
  const isBest = !prev || moves<prev.moves || (moves===prev.moves && elapsed<prev.ms);
  if(isBest) store.set(bestKey(count), {moves, ms:elapsed});

  const perfect = moves===deck.length/2;
  $("winEmoji").textContent = perfect ? "🏅" : "🎉";
  $("winTitle").textContent = perfect ? "PERFECT!" : "You did it!";
  say(perfect ? "Perfect! You found them all!" : "You did it!");
  $("winBadge").innerHTML = isBest ? '<div class="badge">⭐ New Best Score!</div>' : "";
  $("winStats").innerHTML = "You found all "+(deck.length/2)+" "+(deck.length/2===1?"pair":"pairs")+
    "<br>"+moves+(moves===1?" move · ":" moves · ")+fmt(elapsed);
  $("win").classList.add("show");
  confetti();
  syncCount();
}

/* ---------------- layout ---------------- */
function layout(){
  const n=deck.length; if(!n) return;
  const area=document.querySelector(".board-area");
  const r=area.getBoundingClientRect();
  const W=(r.width||area.clientWidth)-8, H=(r.height||area.clientHeight)-8;
  if(W<=0||H<=0){ requestAnimationFrame(layout); return; }
  const gapFor = s => Math.max(5, Math.min(14, s*0.13));
  let best={s:0,score:0,cols:1,gap:10};
  for(let cols=1; cols<=n; cols++){
    const rows=Math.ceil(n/cols);
    let g=10, s=0;
    for(let k=0;k<3;k++){                    // gap depends on size, so settle it
      s=Math.min((W-(cols-1)*g)/cols, (H-(rows-1)*g)/rows);
      g=gapFor(s);
    }
    const score = (cols*rows===n) ? s : s*0.94;   // prefer full rectangles
    if(score>best.score){ best={s, score, cols, gap:g}; }
  }
  const size=Math.floor(Math.max(38, Math.min(best.s, 150)));
  const gap=Math.floor(gapFor(size));
  const root=document.documentElement.style;
  root.setProperty("--cs", size+"px");
  root.setProperty("--gap", gap+"px");
  root.setProperty("--fs", Math.round(size*0.56)+"px");
  $("board").style.gridTemplateColumns="repeat("+best.cols+", var(--cs))";
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", ()=>setTimeout(layout,250));
window.addEventListener("pageshow", layout);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) layout(); });
if(window.ResizeObserver){
  new ResizeObserver(()=>layout()).observe(document.querySelector(".board-area"));
}

/* ---------------- confetti ---------------- */
function confetti(){
  const cv=$("confetti"), ctx=cv.getContext("2d");
  const dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#ffd166","#ef476f","#06d6a0","#118ab2","#f78c6b","#c77dff","#ffffff"];
  const parts=[];
  for(let i=0;i<130;i++){
    parts.push({
      x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.5,
      vx:(Math.random()-0.5)*3, vy:2+Math.random()*4,
      w:6+Math.random()*8, h:8+Math.random()*10,
      a:Math.random()*Math.PI, va:(Math.random()-0.5)*0.25,
      c:cols[Math.floor(Math.random()*cols.length)]
    });
  }
  let frames=0;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.a+=p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    frames++;
    if(frames<330) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

/* ---------------- navigation ---------------- */
function show(which){
  $("menu").classList.toggle("active", which==="menu");
  $("game").classList.toggle("active", which==="game");
  if(which==="menu"){ $("win").classList.remove("show"); syncCount(); }
  if(which==="game") setTimeout(layout,0);
}
function toMenu(){ stopTimer(); if(SPEECH) SPEECH.cancel(); show("menu"); }
function replay(){ $("win").classList.remove("show"); startGame(); }

$("playBtn").onclick = ()=>{ audio(); startGame(); };
$("backBtn").onclick = toMenu;
$("againBtn").onclick = replay;
$("againBtn2").onclick = replay;
$("menuBtn2").onclick = toMenu;
$("soundBtn").onclick = ()=>{
  soundOn=!soundOn; store.set("sound",soundOn);
  $("soundBtn").textContent = soundOn?"🔊":"🔇";
  if(soundOn) SFX.flip();
};

$("voiceBtn").onclick = ()=>{
  voiceOn=!voiceOn; store.set("voice",voiceOn);
  $("voiceBtn").textContent = voiceOn?"🗣️":"🤫";
  if(voiceOn) say("Talking on!", true); else if(SPEECH) SPEECH.cancel();
};

$("soundBtn").textContent = soundOn?"🔊":"🔇";
$("voiceBtn").textContent = voiceOn?"🗣️":"🤫";

})();
